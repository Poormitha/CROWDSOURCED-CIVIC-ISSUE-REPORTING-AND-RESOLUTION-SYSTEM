<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — CivicFix</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">Civic<span class="dot">Fix</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="issues.html">View Issues</a></li>
      <li><a href="report.html">Report Issue</a></li>
      <li><a href="map.html">Map</a></li>
    </ul>
    <div class="nav-user" id="navUser"></div>
  </div>
</header>

<div class="auth-wrap">
  <div class="form-card">
    <h2 style="font-size:22px;">Create Your Citizen Account</h2>
    <p class="muted" style="margin-top:-6px; margin-bottom:22px;">Join CivicFix to report issues and track their resolution.</p>

    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create a password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div class="divider-or">or</div>
    <button class="btn btn-outline btn-block" id="googleBtn">Sign up with Google (optional)</button>

    <p class="small text-center" style="margin-top:20px;">
      Already have an account? <a href="login.html" style="font-weight:700; text-decoration:underline;">Login here</a>
    </p>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div>© 2026 CivicFix — A community reporting platform prototype.</div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("googleBtn").addEventListener("click", () => {
    toast("Google sign-up is a placeholder in this prototype.");
  });

  document.getElementById("registerForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const db = loadDB();
    if (db.users.some(u => u.email.toLowerCase() === email)) {
      toast("An account with this email already exists.");
      return;
    }
    const user = { id: uid("u"), name, email, password, role: "citizen", reputation: 0, badges: [] };
    db.users.push(user);
    saveDB(db);
    setSession(user);
    toast("Account created! Welcome to CivicFix.");
    setTimeout(() => window.location.href = "profile.html", 600);
  });
</script>
</body>
</html>
