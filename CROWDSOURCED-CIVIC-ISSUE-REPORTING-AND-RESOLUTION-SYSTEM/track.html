<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Issue — CivicFix</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">Civic<span class="dot">Fix</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="issues.html">View Issues</a></li>
      <li><a href="report.html">Report Issue</a></li>
      <li><a href="map.html">Map</a></li>
    </ul>
    <div class="nav-user" id="navUser"></div>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="text-center" style="margin-bottom:30px;">
      <h1 style="font-size:28px;">Track Your Issue</h1>
      <p class="muted">Search by issue title or ID to see where it stands in the resolution process.</p>
    </div>

    <div class="flex gap-10" style="max-width:520px; margin:0 auto 40px;">
      <input type="text" id="searchBox" placeholder="e.g. pothole, i1, garbage...">
      <button class="btn btn-primary" id="searchBtn">Track</button>
    </div>

    <div id="results" class="grid-3"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div>© 2026 CivicFix — A community reporting platform prototype.</div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const db = loadDB();

  function timelineCard(issue) {
    const stepIndex = STATUS_STEPS.indexOf(issue.status);
    return `
    <div class="card card-pad" style="grid-column: 1 / -1; margin-bottom:20px;">
      <div class="flex between center-y" style="margin-bottom:6px;">
        <h3 style="font-size:17px;"><a href="issue-details.html?id=${issue.id}">${issue.title}</a></h3>
        <span class="pill ${statusPillClass(issue.status)}">${issue.status}</span>
      </div>
      <p class="small muted">${issue.address} · Reported ${fmtDate(issue.date)}</p>
      <div class="timeline">
        <div class="timeline-track">
          <div class="fill" style="width:${stepIndex <= 0 ? 0 : (stepIndex/(STATUS_STEPS.length-1))*100}%;"></div>
          ${STATUS_STEPS.map((step, i) => {
            const histEntry = issue.history.find(h => h.status === step);
            const cls = i < stepIndex ? "done" : i === stepIndex ? "active" : "";
            return `<div class="t-step ${cls}">
              <div class="t-dot">${i < stepIndex ? "✓" : i+1}</div>
              <div class="t-label">${step}</div>
              <div class="t-date">${histEntry ? fmtDate(histEntry.date) : "Pending"}</div>
            </div>`;
          }).join("")}
        </div>
      </div>
    </div>`;
  }

  function search(query) {
    const q = query.trim().toLowerCase();
    let list = db.issues;
    if (q) list = list.filter(i => i.title.toLowerCase().includes(q) || i.id.toLowerCase() === q || i.category.toLowerCase().includes(q));
    const results = document.getElementById("results");
    if (!list.length) {
      results.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><h3>No matching issues</h3><p>Try a different keyword or issue ID.</p></div>`;
      return;
    }
    results.innerHTML = list.slice(0, 8).map(timelineCard).join("");
  }

  document.getElementById("searchBtn").addEventListener("click", () => search(document.getElementById("searchBox").value));
  document.getElementById("searchBox").addEventListener("keydown", (e) => { if (e.key === "Enter") search(e.target.value); });

  search(""); // show all by default
</script>
</body>
</html>
