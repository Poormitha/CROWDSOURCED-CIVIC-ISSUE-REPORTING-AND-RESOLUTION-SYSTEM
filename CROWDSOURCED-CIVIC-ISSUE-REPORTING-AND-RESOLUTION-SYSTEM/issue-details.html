<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Details — CivicFix</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">Civic<span class="dot">Fix</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="issues.html">View Issues</a></li>
      <li><a href="report.html">Report Issue</a></li>
      <li><a href="map.html">Map</a></li>
    </ul>
    <div class="nav-user" id="navUser"></div>
  </div>
</header>

<section class="section" id="detailWrap">
  <div class="container">Loading issue…</div>
</section>

<footer class="site-footer">
  <div class="container">
    <div>© 2026 CivicFix — A community reporting platform prototype.</div>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const id = new URLSearchParams(window.location.search).get("id");
  const db = loadDB();
  const issue = db.issues.find(i => i.id === id);
  const wrap = document.getElementById("detailWrap");

  if (!issue) {
    wrap.innerHTML = `<div class="container empty-state"><h3>Issue not found</h3><a href="issues.html" class="btn btn-primary">Back to Issues</a></div>`;
  } else {
    const session = getSession();
    const liked = session && issue.likes.includes(session.id);

    wrap.innerHTML = `
      <div class="container">
        <a href="issues.html" class="small muted">&larr; Back to all issues</a>
        <div class="grid-2" style="grid-template-columns: 1.4fr 1fr; margin-top:14px; align-items:start;">
          <div>
            <div class="card">
              <div class="thumb" style="height:280px;"><span style="font-size:90px;">${issue.image}</span></div>
              <div class="card-pad">
                <div class="flex between center-y" style="margin-bottom:10px;">
                  <span class="tag">${issue.category}</span>
                  <span class="pill ${statusPillClass(issue.status)}">${issue.status}</span>
                </div>
                <h1 style="font-size:24px;">${issue.title}</h1>
                <p>${issue.description}</p>
                <table style="margin-top:14px;">
                  <tr><td class="muted">Reported By</td><td>${issue.reportedByName}</td></tr>
                  <tr><td class="muted">Date</td><td>${fmtDate(issue.date)}</td></tr>
                  <tr><td class="muted">Location</td><td>${issue.address}</td></tr>
                  <tr><td class="muted">Severity</td><td class="severity-${issue.severity.toLowerCase()}">${issue.severity}</td></tr>
                  <tr><td class="muted">Assigned Department</td><td>${issue.assignedDept || "Not yet assigned"}</td></tr>
                  <tr><td class="muted">Expected Resolution</td><td>${issue.expectedDate ? fmtDate(issue.expectedDate) : "—"}</td></tr>
                </table>

                <div class="flex gap-10" style="margin-top:20px;">
                  <button class="btn ${liked ? 'btn-dark' : 'btn-outline'} btn-sm" id="likeBtn">👍 Like (<span id="likeCount">${issue.likes.length}</span>)</button>
                  <button class="btn btn-outline btn-sm" id="upvoteBtn">▲ Upvote (<span id="voteCount">${issue.votes}</span>)</button>
                  <button class="btn btn-outline btn-sm" id="shareBtn">🔗 Share</button>
                </div>
              </div>
            </div>

            <div class="card card-pad" style="margin-top:22px;">
              <h3 style="font-size:16px;">Comments (${issue.comments.length})</h3>
              <div id="commentList"></div>
              <form id="commentForm" style="margin-top:16px;">
                <div class="form-group">
                  <textarea id="commentText" placeholder="${session ? 'Add a comment or update...' : 'Login to add a comment.'}" ${session ? '' : 'disabled'}></textarea>
                </div>
                <button class="btn btn-primary btn-sm" ${session ? '' : 'disabled'}>Post Comment</button>
              </form>
            </div>
          </div>

          <div>
            <div class="card card-pad">
              <h3 style="font-size:16px;">Location</h3>
              <div id="detailMap" class="map-frame" style="height:220px;"></div>
            </div>
            <div class="card card-pad" style="margin-top:22px;">
              <h3 style="font-size:16px;">Status Timeline</h3>
              <div id="timelineBox"></div>
            </div>
          </div>
        </div>
      </div>
    `;

    // Comments
    function renderComments() {
      document.getElementById("commentList").innerHTML = issue.comments.map(c => `
        <div class="comment">
          <div class="avatar-sm">${initials(c.user)}</div>
          <div><span class="name">${c.user}</span><span class="date">${timeAgo(c.date)}</span><div class="text">${c.text}</div></div>
        </div>`).join("") || `<p class="muted small">No comments yet. Be the first to comment.</p>`;
    }
    renderComments();

    document.getElementById("commentForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = document.getElementById("commentText").value.trim();
      if (!text || !session) return;
      issue.comments.push({ user: session.name, text, date: new Date().toISOString() });
      saveDB(db);
      document.getElementById("commentText").value = "";
      renderComments();
      toast("Comment posted.");
    });

    document.getElementById("likeBtn").addEventListener("click", () => {
      if (!session) { toast("Login to like this issue."); return; }
      const idx = issue.likes.indexOf(session.id);
      if (idx >= 0) issue.likes.splice(idx, 1); else issue.likes.push(session.id);
      saveDB(db);
      document.getElementById("likeCount").textContent = issue.likes.length;
      document.getElementById("likeBtn").classList.toggle("btn-dark");
      document.getElementById("likeBtn").classList.toggle("btn-outline");
    });

    document.getElementById("upvoteBtn").addEventListener("click", () => {
      if (!session) { toast("Login to upvote this issue."); return; }
      issue.votes += 1;
      saveDB(db);
      document.getElementById("voteCount").textContent = issue.votes;
      toast("Upvoted — this helps authorities prioritize it.");
    });

    document.getElementById("shareBtn").addEventListener("click", () => {
      navigator.clipboard?.writeText(window.location.href);
      toast("Link copied to clipboard.");
    });

    // Map
    const map = L.map('detailMap').setView([issue.lat, issue.lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
    L.circleMarker([issue.lat, issue.lng], { radius: 10, color: markerColor(issue.status), fillColor: markerColor(issue.status), fillOpacity: 0.9, weight: 2 }).addTo(map);

    // Timeline
    const stepIndex = STATUS_STEPS.indexOf(issue.status);
    const pct = stepIndex <= 0 ? 0 : (stepIndex / (STATUS_STEPS.length - 1)) * 100;
    document.getElementById("timelineBox").innerHTML = `
      <div class="timeline">
        <div class="timeline-track" style="flex-direction:column; align-items:flex-start; gap:22px;">
          ${STATUS_STEPS.map((step, i) => {
            const histEntry = issue.history.find(h => h.status === step);
            const state = i < stepIndex ? "done" : i === stepIndex ? "active" : "";
            return `<div class="flex gap-10 center-y">
              <div class="t-dot" style="width:30px; height:30px; ${i <= stepIndex ? (i===stepIndex ? 'border-color:#E0A800;background:#FFC845;color:#1E2328;' : 'border-color:#2E9B4D;color:#2E9B4D;') : ''}">${i < stepIndex ? '✓' : i+1}</div>
              <div><div class="t-label">${step}</div><div class="t-date">${histEntry ? fmtDate(histEntry.date) : 'Pending'}</div></div>
            </div>`;
          }).join("")}
        </div>
      </div>
    `;
  }
</script>
</body>
</html>
