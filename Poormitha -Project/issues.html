<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Issues — CivicFix</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">Civic<span class="dot">Fix</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="issues.html" class="active">View Issues</a></li>
      <li><a href="report.html">Report Issue</a></li>
      <li><a href="map.html">Map</a></li>
    </ul>
    <div class="nav-user" id="navUser"></div>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="section-title-row">
      <div>
        <h1 style="font-size:28px;">All Reported Issues</h1>
        <p class="muted">Browse, filter, and support issues raised by your community.</p>
      </div>
      <a href="report.html" class="btn btn-primary">Report Issue</a>
    </div>

    <div class="filter-bar">
      <input type="text" id="search" placeholder="Search issues...">
      <select id="filterCategory"><option value="">All Categories</option></select>
      <select id="filterStatus">
        <option value="">All Statuses</option>
        <option>Reported</option><option>Verified</option><option>Assigned</option><option>Work Started</option><option>Completed</option>
      </select>
      <select id="filterSeverity">
        <option value="">All Severities</option>
        <option>Low</option><option>Medium</option><option>High</option>
      </select>
      <select id="sortBy">
        <option value="recent">Sort: Most Recent</option>
        <option value="votes">Sort: Most Upvoted</option>
      </select>
    </div>

    <div class="grid-3" id="issueGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <h3>No issues match your filters</h3>
      <p>Try adjusting the search or filters above.</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div>© 2026 CivicFix — A community reporting platform prototype.</div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const catSel = document.getElementById("filterCategory");
  CATEGORIES.forEach(c => catSel.innerHTML += `<option value="${c}">${c}</option>`);

  function render() {
    const db = loadDB();
    let list = [...db.issues];
    const q = document.getElementById("search").value.trim().toLowerCase();
    const cat = document.getElementById("filterCategory").value;
    const status = document.getElementById("filterStatus").value;
    const sev = document.getElementById("filterSeverity").value;
    const sort = document.getElementById("sortBy").value;

    if (q) list = list.filter(i => i.title.toLowerCase().includes(q) || i.description.toLowerCase().includes(q) || i.address.toLowerCase().includes(q));
    if (cat) list = list.filter(i => i.category === cat);
    if (status) list = list.filter(i => i.status === status);
    if (sev) list = list.filter(i => i.severity === sev);

    if (sort === "votes") list.sort((a,b) => b.votes - a.votes);
    else list.sort((a,b) => new Date(b.date) - new Date(a.date));

    document.getElementById("issueGrid").innerHTML = list.map(issueCardHTML).join("");
    document.getElementById("emptyState").style.display = list.length ? "none" : "block";
  }

  ["search","filterCategory","filterStatus","filterSeverity","sortBy"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
    document.getElementById(id).addEventListener("change", render);
  });

  render();
</script>
</body>
</html>
